name: release

permissions:
  contents: write
  packages: write

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/glassflow/lore
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag '$VERSION' is not vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
      - name: Extract the binary from the pushed image
        run: |
          docker pull --platform linux/amd64 "$IMAGE:$VERSION"
          id=$(docker create --platform linux/amd64 "$IMAGE:$VERSION")
          docker cp "$id:/usr/local/bin/lore" ./lore
          docker rm "$id"
          # Run the extracted file in the image's own userland: it is linked against Debian
          # trixie, which the runner's glibc may be older than.
          got=$(docker run --rm --platform linux/amd64 -v "$PWD/lore:/lore:ro" --entrypoint /lore "$IMAGE:$VERSION" --version)
          [ "$got" = "lore $VERSION" ] || { echo "binary reports '$got', expected 'lore $VERSION'" >&2; exit 1; }
          mv lore "lore-$VERSION-linux-amd64"
          sha256sum "lore-$VERSION-linux-amd64" > "lore-$VERSION-linux-amd64.sha256"
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" --generate-notes \
            "lore-$VERSION-linux-amd64" "lore-$VERSION-linux-amd64.sha256"
